[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ranktwosample"
version = "0.1.0"
description = "Permutation-calibrated two-sample tests using joint comparison ranks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "José Manuel de Frutos" },
  { name = "Viktor Stein" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plots = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ranktwosample*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
