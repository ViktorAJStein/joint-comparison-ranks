name: Reproducibility smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra plots
      - run: uv run --locked python scripts/check_manifest.py
      - run: uv run --locked pytest snapshots/comparator/tests
      - run: uv run --locked python scripts/run_paper.py --study comparator --mode smoke --out runs/ci-smoke --wall-seconds 600
      - run: uv run --locked python scripts/plot_paper.py --out reproduced-figures
